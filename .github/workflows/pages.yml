name: Pages

# Publishes the landing page (lp/) to GitHub Pages with every example under examples/ rendered by the
# commit being published (scripts/build-site.ts), so the videos are never committed.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node

      - name: Build the package
        run: pnpm build

      - name: Install Chromium for rendering
        run: pnpm exec playwright install --with-deps chromium

      # The same profile as check.yaml: Ubuntu restricts user namespaces for downloaded executables,
      # so allow only the Playwright browser to create them rather than disable Chromium's sandbox.
      - name: Allow sandboxed Playwright Chromium on the runner
        run: |
          sudo apparmor_parser -r /dev/stdin <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile motion-kit-playwright ${HOME}/.cache/ms-playwright/**/{chrome,chrome-headless-shell} flags=(unconfined) {
            userns,
          }
          EOF

      - name: Install FFmpeg for encoding
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Render the examples and assemble the site
        run: node scripts/build-site.ts

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
