name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node

      - name: Run linting
        run: pnpm lint

      - name: Build the package
        run: pnpm build

      - name: Run type checking
        run: pnpm typecheck

      # Checks the Lean proofs and builds .lake/build/bin/spec-oracle, which the differential tests need.
      - name: Build Lean specs
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: false
          build: true
          test: false
          lint: false

      - name: Install Chromium for Composition DOM, loading and frame-transport tests
        run: pnpm exec playwright install --with-deps chromium

      # Ubuntu restricts user namespaces for downloaded executables. Allow only
      # the test browser to create them; do not disable Chromium's sandbox.
      - name: Allow sandboxed Playwright Chromium on the CI runner
        run: |
          sudo apparmor_parser -r /dev/stdin <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile motion-kit-playwright ${HOME}/.cache/ms-playwright/**/{chrome,chrome-headless-shell} flags=(unconfined) {
            userns,
          }
          EOF

      - name: Run unit tests
        run: pnpm test --project unit

      - name: Run Composition DOM tests
        run: pnpm test --project composition-dom

      - name: Run supervised loading-session tests
        run: pnpm test --project loading

      - name: Run frame transport and PNG determinism tests
        run: pnpm test --project frame-transport

      # The encoder and the CLI's mp4 route spawn the system FFmpeg, so the runner needs one.
      # Every case fails on a missing binary (there is no skip), which is why the install is
      # asserted here instead of left to whatever the runner image happens to ship.
      - name: Install FFmpeg for the encoder tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
          encoders="$(ffmpeg -hide_banner -encoders)"
          case "$encoders" in
            *'libx264 '*) ;;
            *)
              echo '::error::The installed FFmpeg has no libx264 encoder, which the MP4 route requires.'
              exit 1
              ;;
          esac

      - name: Run encoder port tests
        run: pnpm test --project encoding

      - name: Run CLI tests
        run: pnpm test --project cli

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the PR's commits through the API on pull_request events.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Scans the whole history for committed secrets. A personal account needs no GITLEAKS_LICENSE.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
